# DNS-over-TLS (TCP) via Traefik IngressRouteTCP.
# Entrypoint "dot" = host :853 (Traefik hostNetwork; see rancher-syd-prod values).
# TLS passthrough: AdGuard terminates DoT itself with the cert-manager cert
# (dns.adguard.sigaint.au) mounted at /opt/adguardhome/certs.
# HostSNIRegexp(`.*`) catch-all so SNI-less DoT clients connect too.
# NOTE: plain HostSNI(`*`) matches nothing on this Traefik version (verified
# live: connections closed with zero bytes, with and without SNI) — the
# regexp form is required.
# port must match Service port name (dot), like dns-udp in ingressroute-udp.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: adguard-dot
spec:
  entryPoints:
    - dot
  routes:
    - match: HostSNIRegexp(`.*`)
      services:
        - name: adguard
          port: dot
  tls:
    passthrough: true
