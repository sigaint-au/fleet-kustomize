# The Lounge — modern web IRC client (rancher-syd-prod only).
#
# Chart: https://charts.schoenwald.aero (thelounge)
# App:   docker.io/thelounge/thelounge (image tag set in values; chart appVersion may lag)
#
# Endpoint:
#   https://irc.sigaint.au/
#
# Requires the supporting bundle at applications/thelounge/config/
# (NetworkPolicies for Traefik hostNetwork on rancher-syd-prod).
#
# Note: Avoid TrueCharts here — its common library ships a template file with a
# space in the name (`_topologySpreadConstraints .tpl`), which Fleet rejects
# during post-render ("illegal name ... in file creation").

defaultNamespace: thelounge
labels:
  component: thelounge-install

helm:
  repo: https://charts.schoenwald.aero
  chart: thelounge
  version: 0.1.2
  releaseName: thelounge

targetCustomizations:
  - name: rancher-syd-prod
    clusterSelector:
      matchLabels:
        sigaint.au/cluster-id: rancher-syd-prod
    helm:
      valuesFiles:
        - values/rancher-syd-prod.yaml

  # IRC only on rancher-syd-prod (public edge with Traefik hostNetwork).
  - name: exclude-others
    clusterSelector: {}
    doNotDeploy: true

dependsOn:
  - selector:
      matchLabels:
        component: thelounge-config
