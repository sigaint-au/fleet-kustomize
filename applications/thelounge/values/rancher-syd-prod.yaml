# Values for The Lounge on irc.sigaint.au (rancher-syd-prod cluster)
#
# Chart: oci://oci.trueforge.org/truecharts/thelounge v17.7.5 (app 4.5.2)
# Common library: TrueCharts common (ingress/service/persistence schema).
#
# TLS terminates at Traefik Ingress; cert-manager issues the cert via
# ClusterIssuer le-production. Config and user data live on a PVC at /config.

image:
  repository: docker.io/thelounge/thelounge
  pullPolicy: IfNotPresent
  tag: 4.5.2@sha256:ec3e798d7d9243e49f4f268a4d83c03606fb7e8ace07191e8d1260faceb68d13

service:
  main:
    ports:
      main:
        port: 10061
        targetPort: 9000

ingress:
  main:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: le-production
    hosts:
      - host: irc.sigaint.au
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: irc-sigaint-au-tls
        hosts:
          - irc.sigaint.au

persistence:
  config:
    enabled: true
    mountPath: /config
    size: 5Gi

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            THELOUNGE_HOME: /config

securityContext:
  container:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
