apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netbird

commonLabels:
  app.kubernetes.io/managed-by: Kustomize

# ponytail: no app.kubernetes.io/name in commonLabels — 3 sub-apps need distinct values (dashboard/server/reverse-proxy); global label would overwrite selectors.

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - configmap.yaml
  - certificate.yaml
  - service.yaml
  - deployment.yaml
  - gateway.yaml
  - externalsecret.yaml
  - networkpolicy.yaml
