apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netbird

# ponytail: no commonLabels — 3 sub-apps need distinct app.kubernetes.io/name (dashboard/server/reverse-proxy); global label would overwrite selectors.

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - configmap.yaml
  - certificate.yaml
  - service.yaml
  - deployment.yaml
  - gateway.yaml
  - externalsecret.yaml
  - networkpolicy.yaml
