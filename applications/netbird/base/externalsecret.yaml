# Doppler -> K8s sync. Fill Doppler keys then Fleet creates the Secrets.
# ponytail: 3 ExternalSecrets enough; per-key secrets YAGNI until rotation granular needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-server-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: netbird
    creationPolicy: Merge
  data:
    - secretKey: datastoreEncryptionKey
      remoteRef:
        key: NETBIRD_DATASTORE_ENCRYPTION_KEY
    - secretKey: idpClientID
      remoteRef:
        key: NETBIRD_IDP_CLIENT_ID
    - secretKey: idpClientSecret
      remoteRef:
        key: NETBIRD_IDP_CLIENT_SECRET
    - secretKey: idpProjectID
      remoteRef:
        key: NETBIRD_IDP_PROJECT_ID
    - secretKey: idpServiceUser
      remoteRef:
        key: NETBIRD_IDP_SERVICE_USER
    - secretKey: idpServiceUserSecret
      remoteRef:
        key: NETBIRD_IDP_SERVICE_USER_SECRET
    - secretKey: relayPassword
      remoteRef:
        key: NETBIRD_RELAY_PASSWORD
    - secretKey: stunServer
      remoteRef:
        key: NETBIRD_STUN_SERVER
---
