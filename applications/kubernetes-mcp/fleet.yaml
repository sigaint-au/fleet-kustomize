# Kubernetes MCP Server on rancher-syd-prod only.
defaultNamespace: kubernetes-mcp
labels:
  component: kubernetes-mcp-install

helm:
  chart: oci://ghcr.io/containers/charts/kubernetes-mcp-server
  version: 0.1.0
  releaseName: kubernetes-mcp
  valuesFiles:
    - values/common.yaml

targetCustomizations:
  - name: rancher-syd-prod
    clusterSelector:
      matchLabels:
        sigaint.au/cluster-id: rancher-syd-prod

  - name: exclude-others
    clusterSelector: {}
    doNotDeploy: true

dependsOn:
  - selector:
      matchLabels:
        component: kubernetes-mcp-config
