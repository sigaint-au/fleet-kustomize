# The middleware filters external clients; this policy blocks direct pod access.
# Traefik on rancher-syd-prod uses hostNetwork, so allow its observed node paths.
# Update IPs if the nodes or pod CIDRs change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-from-traefik-nodes
  labels:
    sigaint.au/network-policy: app
    app.kubernetes.io/name: kubernetes-mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kubernetes-mcp
      app.kubernetes.io/name: kubernetes-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        # hostNetwork same-node / public node addresses
        - ipBlock:
            cidr: 51.161.136.107/32
        - ipBlock:
            cidr: 139.99.149.92/32
        - ipBlock:
            cidr: 139.99.210.89/32
        - ipBlock:
            cidr: 139.99.210.170/32
        # hostNetwork IPv6 addresses
        - ipBlock:
            cidr: 2402:1f00:8101:15c::1/128
        - ipBlock:
            cidr: 2402:1f00:8101:959::1/128
        - ipBlock:
            cidr: 2402:1f00:8101:9aa::1/128
        # flannel WireGuard cross-node paths
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.1.0/32
        - ipBlock:
            cidr: 10.42.3.0/32
        # cni0 bridge paths
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.3.1/32
      ports:
        - protocol: TCP
          port: 8080
