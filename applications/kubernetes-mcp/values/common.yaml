# Keep cluster-admin access behind a Traefik IP allowlist.
image:
  version: "v0.0.67"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: le-production
    traefik.ingress.kubernetes.io/router.middlewares: kubernetes-mcp-mcp-allowlist@kubernetescrd
  host: kubernetes-mcp.apps.rancher.syd.prod.sigaint.au
  path: /
  pathType: Prefix
  tls:
    secretName: kubernetes-mcp-tls

config:
  read_only: false
  require_oauth: true
  skip_jwt_verification: true
  cluster_auth_mode: passthrough

rbac:
  extraClusterRoleBindings:
    - name: cluster-admin
      roleRef:
        name: cluster-admin
        external: true
