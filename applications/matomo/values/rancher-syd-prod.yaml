# Values for Matomo on ping.sigaint.au (rancher-syd-prod cluster)
#
# Chart: oci://registry-1.docker.io/digitalist/matomo 12.0.21 (app 5.12.0)
#
# Routing: dashboard Ingress serves `/` and the tracker Ingress serves only
# the tracking endpoints (/matomo.php, /matomo.js, /piwik.*, /js/.*, …), so
# both Ingresses share the ping.sigaint.au hostname without conflicting —
# Traefik prefers the longer tracker paths. TLS terminates at Traefik;
# cert-manager issues the cert via ClusterIssuer le-production (annotation is
# on the dashboard Ingress only so exactly one Certificate is created; the
# tracker Ingress just references the same secret).

# The chart namespaces every object with .Values.namespace (not the release
# namespace), so this MUST match the bundle's defaultNamespace.
namespace: customer-sites

matomo:
  ingress:
    enabled: true

  dashboard:
    hostname: ping.sigaint.au
    tls: true
    secretName: ping-sigaint-au-tls
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: le-production
    # Placeholder admin password — rotate it in the Matomo UI after first
    # login. (The chart offers no secret-backed knob for firstuser.)
    firstuser:
      username: admin
      password: E9ArB8EOJnEYLJuBepCoBX9+1pAsFCfs
      email: admin@sigaint.au

  tracker:
    hostname: ping.sigaint.au
    tls: true
    secretName: ping-sigaint-au-tls

# Database comes from the matomo-database bundle (Bitnami MariaDB,
# release matomo-db, standalone single replica) in this same namespace.
# The password is Doppler-managed (MATOMO_DB_ROOT_PASSWORD) via the
# matomo-db-credentials ExternalSecret — not the chart-generated Secret.
# The install Jobs block until the DB is reachable, and Fleet orders the
# bundles via dependsOn — no manual sequencing needed.
db:
  hostname: matomo-db-mariadb
  port: 3306
  name: matomo
  username: root
  password:
    secretKeyRef:
      name: matomo-db-credentials
      key: mariadb-root-password
