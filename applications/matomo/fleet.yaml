# Matomo web analytics for https://ping.sigaint.au (rancher-syd-prod only).
#
# Chart: oci://registry-1.docker.io/digitalist/matomo
#   (Helm chart at charts/matomo in
#   https://github.com/Digitalist-Open-Cloud/matomo-kubernetes)
#
# Requires the supporting bundle at applications/matomo/config/
# (baseline NetworkPolicies + Traefik hostNetwork allow-list).
#
# NOTE: the chart ships no database. db.* in values/rancher-syd-prod.yaml
# points at the matomo-database bundle (Bitnami MariaDB, release matomo-db)
# in this same namespace — ordered via dependsOn below.
defaultNamespace: customer-sites
labels:
  component: matomo-install

targetCustomizations:

  - name: rancher-syd-prod
    clusterSelector:
      matchLabels:
        sigaint.au/cluster-id: rancher-syd-prod
    helm:
      chart: oci://registry-1.docker.io/digitalist/matomo
      version: 12.0.21
      releaseName: matomo
      valuesFiles:
        - values/rancher-syd-prod.yaml

  # Matomo only on rancher-syd-prod (config above).
  - name: exclude-others
    clusterSelector: {}
    doNotDeploy: true

dependsOn:
  - selector:
      matchLabels:
        component: matomo-config
  - selector:
      matchLabels:
        component: matomo-database
