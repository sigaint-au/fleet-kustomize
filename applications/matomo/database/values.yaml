# Values for the Matomo MariaDB on rancher-syd-prod.
#
# Chart: oci://registry-1.docker.io/bitnamicharts/mariadb 28.1.1
#
# Single-replica standalone instance (architecture: standalone deploys exactly
# one primary, no secondaries). Release `matomo-db` creates Service
# `matomo-db-mariadb`; the Secret is Doppler-managed (matomo-db-credentials
# ExternalSecret) because auth.existingSecret is set — the chart creates none.

# Explicit single replica — do not switch to `replication` (that adds
# secondaries and a different topology).
architecture: standalone

auth:
  # Root password comes from Doppler (MATOMO_DB_ROOT_PASSWORD) via the
  # matomo-db-credentials ExternalSecret in the matomo-config bundle.
  # The Secret must contain key `mariadb-root-password`. `rootPassword`
  # below is ignored when existingSecret is set.
  existingSecret: matomo-db-credentials
  rootPassword: ""
  database: matomo

primary:
  persistence:
    enabled: true
    size: 10Gi
