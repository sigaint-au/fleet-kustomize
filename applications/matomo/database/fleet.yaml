# MariaDB for Matomo (rancher-syd-prod only).
#
# Chart: oci://registry-1.docker.io/bitnamicharts/mariadb
#
# Single-replica standalone instance in customer-sites. Creates database
# `matomo`; the Matomo bundle consumes it via db.* (hostname
# matomo-db-mariadb, root password Secret matomo-db-mariadb).
# The Matomo Helm bundle depends on this bundle via component: matomo-database.
defaultNamespace: customer-sites
labels:
  component: matomo-database

targetCustomizations:

  - name: rancher-syd-prod
    clusterSelector:
      matchLabels:
        sigaint.au/cluster-id: rancher-syd-prod
    helm:
      chart: oci://registry-1.docker.io/bitnamicharts/mariadb
      version: 28.1.1
      releaseName: matomo-db
      valuesFiles:
        - values.yaml

  # Database only on rancher-syd-prod (config above).
  - name: exclude-others
    clusterSelector: {}
    doNotDeploy: true

# Wait for the matomo-config bundle so the matomo-db-credentials
# ExternalSecret (Doppler: MATOMO_DB_ROOT_PASSWORD) exists before the
# StatefulSet first reads it.
dependsOn:
  - selector:
      matchLabels:
        component: matomo-config
