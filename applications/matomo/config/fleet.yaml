# Supporting NetworkPolicies for Matomo (rancher-syd-prod only).
#
# The main Helm chart depends on this bundle via component: matomo-config.
#
# Note: the chart renders its own per-component NetworkPolicies (allow-all
# ingress by default). These policies add the namespace baseline and keep the
# Traefik hostNetwork path working if networkPolicy.ingress is tightened later.

defaultNamespace: customer-sites
labels:
  component: matomo-config

targetCustomizations:
  - name: rancher-syd-prod
    clusterSelector:
      matchLabels:
        sigaint.au/cluster-id: rancher-syd-prod
    kustomize:
      dir: base

  # Config only for rancher-syd-prod.
  - name: exclude-others
    clusterSelector: {}
    doNotDeploy: true
