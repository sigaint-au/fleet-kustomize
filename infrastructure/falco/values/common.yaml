# Falco values, uniform across all clusters.
#
# Chart: https://falcosecurity.github.io/charts (falco) 9.1.0, app 0.44.1.
#
# Events flow: Falco DaemonSet -> embedded falcosidekick Service (auto-wired
# by the parent chart: json_output + http_output) -> pica API via the
# webhook output with a Bearer custom header. Falco 0.44 http_output has no
# custom-header support, so Falco cannot authenticate to pica directly —
# the embedded forwarder injects the header and adds buffering/retry.
#
# TODO: move the pica token to Doppler via ExternalSecret and rotate it —
# it is committed here in plaintext as an interim measure.

driver:
  # modern eBPF probe — no kernel headers needed on the k3s nodes.
  # Fall back to kmod only if the probe fails to load on a node.
  kind: modern_ebpf

falco:
  stdout_output:
    enabled: true
  syslog_output:
    enabled: false

# Embedded forwarder (NOT the standalone applications/falcosidekick release,
# which is left untouched): single purpose is shipping Falco events to pica.
falcosidekick:
  enabled: true
  config:
    webhook:
      address: "https://pica.sigaint.au/api/v1/events"
      customHeaders: "Authorization: Bearer MPTX1wkZ56Zg64tOK55O0yIMCgkq9MBgV9Iooe_xi70"
